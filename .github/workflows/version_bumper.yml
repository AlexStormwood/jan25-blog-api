on:
  workflow_dispatch:
    inputs:
      bumpType:
        description: SemVer incremenet type to use!
        required: true
        default: patch # vX.X.99999
        type: choice
        options:
          - patch
          - minor
          - major


permissions:
  contents: write
  pull-requests: write

jobs:
  
  conventional-commits-processor:
    # if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    outputs:
      new-tag: ${{ steps.bumper-step.outputs.newTag }}

    steps:
    - uses: actions/checkout@v4

    - name:  'Automated Version Bump'
      id: bumper-step
      uses:  'phips28/gh-action-bump-version@master'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        version-type:  ${{ inputs.bumpType }}

        # v1.1.9
        # UPDATE AS MAJOR 
        # v2.0.0
      
