  docker-cd-call:
    needs: [conventional-commits-processor]
    permissions: 
      packages: write
      contents: read
    uses: ./.github/workflows/docker-cd.yml
    with:
        new-version-tag: ${{ needs.conventional-commits-processor.outputs.new-tag }}