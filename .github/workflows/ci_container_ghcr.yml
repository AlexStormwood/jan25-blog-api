name: Build and Push Docker Image (GHCR)
# Build and push our Docker image to the GitHub Container Registry

on:
  push:
    branches: 
      - main

# Environment variables available to every job in the workflow file
env:
  OWNER_LC: ""
  REPO_LC: ""

jobs:

  build_container:
    name: Build Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional, handy for multiplatform projects
      # e.g. docker image with very niche platform base images
      # FreeBSD, linux but with a weird CPU e.g. 32bit stuff or 16bit stuff or embeded hardware
      - name: Set up QEMU 
        uses: docker/setup-qemu-action@v4

      # This is the nicer new Docker build library, should be good to use 
      # Not essential, but some commands may require buildx to be available
      # so if the resource you follow uses it, you MUST have this done first
      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v4

      - name: Sanitise user and repo name to be lowercase
        run: | 
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
          echo "REPO_LC=${REPO,,}" >>${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'
          REPO: '${{ github.repository }}'
          

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          #     alexstormwood/somecustomnameotherthanthereponame
          # tags: ${{ github.repository_owner }}/somecustomnameotherthanthereponame:latest          
          #     alexstormwood/jan25-blog-api
          # tags: ${{ github.repository }}:latest
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest

      # - name: Notify Discord
      #   uses: MineBartekSA/discord-webhook@v2
      #   with:
      #     webhook: ${{ secrets.WEBHOOK_URL }}
      #     content: Hello Discord! New Docker image available at '${{ env.REPO_LC }}:latest'