# Kubernetes resource config for the Express app itself
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
  namespace: jan25-blog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-api
  template:
    metadata:
      labels:
        app: blog-api
    spec:
      containers:
      - name: blog-api
        image: jan25blogapi-backend:latest
        imagePullPolicy: Never
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - name: server
          containerPort: 3000
        env:
          - name: PORT 
            value: "3000"
          - name: DATABASE_URL
            valueFrom: 
              secretKeyRef:
                name: blog-api-config
                key: DATABASE_URL
          - name: JWT_SECRET_KEY
            valueFrom: 
              secretKeyRef:
                key: JWT_SECRET_KEY
                name: blog-api-config
        startupProbe:
          httpGet:
            path: / 
            port: server 
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe: 
          httpGet:
            path: / 
            port: server 
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe: 
          httpGet:
            path: / 
            port: server 
          initialDelaySeconds: 10
          periodSeconds: 10

---

# Express server resource config for Kubernetes 
apiVersion: v1 
kind: Service 
metadata: 
  name: blog-api
  namespace: jan25-blog-api
spec: 
  type: NodePort 
  selector: 
    app: blog-api 
  ports: 
    - name: server 
      port: 80 
      targetPort: http

